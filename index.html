<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>何岩pose网</title>
<style>
:root{--bg:#fff;--bg2:#f6f6f6;--fg:#121212;--fg2:#646464;--line:#ebebeb;--blue:#0066ff;--soft:#e5f0ff;--dg:#d93025}
:root[data-theme=dark]{--bg:#121212;--bg2:#1e1e1e;--fg:#e8e8e8;--fg2:#9a9a9a;--line:#2c2c2c;--blue:#4c94ff;--soft:#14284a;--dg:#ff6b60}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.6 -apple-system,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei Light","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 14px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.on{background:var(--soft);border-color:var(--blue);color:var(--blue)}
button.dg{color:var(--dg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0) 12px 0;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:9px;font-weight:300;font-size:21px;letter-spacing:.06em;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
.logo svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs{display:flex;gap:2px;flex:1;margin-left:10px;align-self:stretch}
#tabs button{border:0;border-radius:0;background:none;color:var(--fg2);padding:0 10px;border-bottom:2px solid transparent;margin-top:2px}
#tabs button.on{color:var(--blue);background:none;border-bottom-color:var(--blue)}
.ib{width:38px;height:38px;padding:0;border:0;background:none;display:grid;place-items:center;border-radius:50%;font-size:18px}
.ib:hover{background:var(--bg2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#up{background:var(--blue);color:#fff}#up:hover{background:var(--blue)}
#usage{display:flex;align-items:center;gap:10px;color:var(--fg2);font-size:12px;margin-bottom:10px}
.ub{width:72px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex:none}.ub i{display:block;height:100%;background:var(--blue)}
@media(max-width:480px){.logo{font-size:17px;gap:6px}.logo i{width:26px;height:26px}#tabs{margin-left:2px}#tabs button{padding:0 7px}.ib{width:34px;height:34px}header{gap:4px;padding-left:10px;padding-right:8px}}
main{max-width:1200px;margin:0 auto;padding:12px}
#warn{background:var(--soft);color:var(--blue);border-radius:8px;padding:8px 12px;margin-bottom:10px}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:16px;padding:3px 14px;background:var(--bg2);border:0}
.chip.on{background:var(--soft);color:var(--blue)}
#gal{columns:2;column-gap:10px}
@media(min-width:700px){#gal{columns:4}}
@media(min-width:1100px){#gal{columns:5}}
.card{break-inside:avoid;margin-bottom:10px;position:relative;border-radius:10px;overflow:hidden;background:var(--bg2);cursor:zoom-in}
.card img{display:block;width:100%;height:auto}
.tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:0 8px;border-radius:10px}
.empty{color:var(--fg2);text-align:center;padding:60px 16px;column-span:all}
.pcard{background:var(--bg2);border-radius:14px;padding:14px;text-align:center;margin-bottom:14px}
.pcard>img{max-height:42vh;max-width:100%;border-radius:10px;cursor:zoom-in}
.pn{color:var(--fg2);margin-top:6px}
.pt{font-size:20px;line-height:1.6;margin:8px 0 12px;font-weight:300}
.pbtn{display:flex;gap:8px;justify-content:center;margin-top:8px}
.pbtn button{flex:1;max-width:160px;padding:10px}
.hint{color:var(--fg2);font-size:13px;margin:10px 0 0}
.prow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.prow img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none}
.prow .tx{flex:1;cursor:pointer}.prow .tx small{color:var(--blue)}
.prow .tx.cur{color:var(--blue)}
#v{position:fixed;inset:0;z-index:20;background:#000;color:#eee;display:flex;flex-direction:column}
#v[hidden],#m[hidden],[hidden]{display:none!important}
.vt{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px}
.vt .sp{flex:1}.vt button{background:rgba(255,255,255,.12);border:0;color:#fff;min-width:38px}
#st{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;position:relative}
#vi{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;will-change:transform}
.nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:56px;font-size:26px;padding:0;z-index:2}
.nv.l{left:6px}.nv.r{right:6px}
.vp{background:var(--bg);color:var(--fg);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row select,.row input{flex:1}
#m{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
#mb{background:var(--bg);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
#mb h3{margin:0 0 10px}#mb label{display:block;font-size:13px;color:var(--fg2);margin:8px 0 3px}
.mr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.mr span{flex:1}
#tt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:40;max-width:90vw;font-size:14px}

:root{--or:#ff6a1a;--hero:#0066ff}
:root[data-theme=dark]{--or:#ff8a3d;--hero:#0a4fd1}
button:disabled{opacity:.5;cursor:default}
button.or{background:var(--or);border-color:var(--or);color:#fff}
.logo i{background:var(--hero)}
.logo svg{width:22px;height:22px;stroke-width:3.4}
#tabs button.on{border-bottom:3px solid var(--or)}
#up{background:var(--or);color:#fff}#up:hover{background:var(--or)}
.ib span{display:block;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
#st2:hover span{transform:rotate(120deg)}#th.sp span{transform:rotate(180deg)}
#up:hover svg{animation:bob .5s ease infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
#hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;min-height:150px}
#hero::before{content:"";position:absolute;right:-40px;top:-50px;width:230px;height:230px;border-radius:50%;background:var(--or)}
#hero::after{content:"";position:absolute;left:46%;bottom:-34px;width:72px;height:72px;border-radius:50%;border:9px solid rgba(255,255,255,.22)}
.hl{position:relative;z-index:1}
#hero h1{margin:0;font-weight:300;font-size:clamp(28px,7vw,44px);letter-spacing:.08em;line-height:1.2}
#hero p{margin:6px 0 10px;opacity:.9}
#hero #usage{color:rgba(255,255,255,.85);margin:0}
#hero .ub{background:rgba(255,255,255,.3)}#hero .ub i{background:var(--or)}
.fig{position:relative;z-index:1;width:130px;height:130px;flex:none}.fig svg{width:100%;height:100%;stroke-width:2.2}
@media(max-width:480px){.fig{width:100px;height:100px}#hero{padding:18px}}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
#chips{flex:1 1 100%;padding-bottom:0}
#ctl{display:flex;gap:8px;margin-left:auto}
#ctl button{border-radius:16px;padding:3px 14px}
@media(min-width:700px){#chips{flex:1 1 auto}}
.chip.on{background:var(--blue);color:#fff}
.card{border-radius:14px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:5px 5px 0 var(--or)}
.card img{transition:transform .4s}.card:hover img{transform:scale(1.05)}
.tag{background:var(--or)}
.rt{position:absolute;right:6px;top:6px;background:var(--blue);color:#fff;font-size:12px;padding:0 8px;border-radius:10px}
.pcard{background:var(--hero);color:#fff;border-radius:18px}
.pcard .pn,.pcard .hint{color:rgba(255,255,255,.7)}
.pcard .pt{font-size:22px}
.pcard button{background:rgba(255,255,255,.14);border:0;color:#fff}
.pcard button.pri,.pcard button.on{background:var(--or);color:#fff}
.prow .tx small{color:var(--or)}
.vt{position:relative;z-index:3;background:linear-gradient(rgba(0,0,0,.65),transparent)}
#st{position:absolute;inset:0}
.vp{position:absolute;left:0;right:0;bottom:0;z-index:4;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s}
.vp.show{transform:none}
.stars{display:flex;gap:2px;margin-bottom:8px}
.stars button,.stars button.on{border:0;background:none;font-size:28px;line-height:1;padding:0 4px;color:var(--line)}
.stars button.on{color:var(--or)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root,:root[data-theme=dark]{--or:var(--blue)}
.tag{background:rgba(0,0,0,.5)}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.14)}
.pcard{background:var(--bg2);color:var(--fg)}
.pcard .pn,.pcard .hint{color:var(--fg2)}
.pcard button{background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.pcard button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.pcard button.on{background:var(--soft);border-color:var(--blue);color:var(--blue)}
#gal{columns:auto!important;display:flex;gap:10px;align-items:flex-start}
.col{flex:1;min-width:0}.empty{flex:1}
#mic.on{background:var(--soft);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(0,102,255,.2)}}
.pcard select{flex:1;max-width:170px;width:auto;background:var(--bg)}
@keyframes rise{from{opacity:0;transform:translateY(.55em);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes wave{0%,55%,100%{transform:none;color:inherit}25%{transform:translateY(-3px);color:var(--blue)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,14px) scale(.95)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.lt{display:inline-flex}
.lt .ch{display:inline-block;opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) both,wave 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*80ms),calc(1.4s + var(--i)*140ms)}
.pt .c{display:inline-block;opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*var(--d,25ms))}
.card.fx{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*45ms)}
#tt{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
#v:not([hidden]){animation:fadeIn .25s}
button{transition:transform .15s,background .2s,color .2s,border-color .2s}
button:active{transform:scale(.95)}
#tabs button{transition:color .25s,border-color .25s}
.eq{display:none;gap:2px;align-items:flex-end;height:12px;margin-left:10px;vertical-align:middle}
body.speaking .eq{display:inline-flex}
.eq b{width:3px;background:var(--blue);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
@media(prefers-reduced-motion:reduce){.ch,.c{opacity:1!important}}
.pbar{height:3px;background:rgba(0,102,255,.15);border-radius:2px;margin-top:10px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--blue);transform-origin:left;animation:fill linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</head>
<body>
<header>
  <span class="logo"><i id="lgm"></i><span class="lt"><span class="ch" style="--i:0">何</span><span class="ch" style="--i:1">岩</span><span class="ch" style="--i:2">p</span><span class="ch" style="--i:3">o</span><span class="ch" style="--i:4">s</span><span class="ch" style="--i:5">e</span><span class="ch" style="--i:6">网</span></span></span>
  <div id="tabs"><button data-v="gal">图库</button><button data-v="pose">Pose 库</button></div>
  <button class="ib" id="th" title="白天/黑夜" aria-label="切换主题"><span>◐</span></button>
  <button class="ib" id="mic" title="语音控制" aria-label="语音控制"><span>🎤</span></button>
  <button class="ib" id="st2" title="管理员" aria-label="管理员"><span>⚙</span></button>
  <button class="ib" id="up" title="上传图片（也可以直接 Ctrl+V 粘贴）" aria-label="上传图片"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button>
  <input type="file" id="fi" accept="image/*" multiple hidden>
</header>
<main>
  <div id="usage" hidden title="数据来自 GitHub，可能有几分钟延迟"><span class="ub"><i></i></span><span></span></div>
  <div id="warn">还没连接 GitHub：点右上角 ⚙ 填写仓库和 Token 后即可上传、分类和修改。</div>
  <div id="bar"><div id="chips"></div><div id="ctl"><button id="srt"></button><button id="rb" class="or"></button></div></div>
  <div id="gal"></div>
  <div id="pose" hidden></div>
</main>

<div id="v" hidden>
  <div class="vt"><span id="vc"></span><span class="sp"></span><button id="vi2" aria-label="分类与描述">ⓘ</button><button id="zo" aria-label="缩小">−</button><button id="zi" aria-label="放大">+</button><button id="vx" aria-label="关闭">✕</button></div>
  <div id="st"><img id="vi" alt=""><button class="nv l" id="vl" aria-label="上一张">‹</button><button class="nv r" id="vr" aria-label="下一张">›</button></div>
  <div class="vp" id="vp"><div class="stars" id="vst"></div>
    <div class="row"><select id="vcat" aria-label="分类"></select><button id="vrec">识别 pose</button><button id="vdel" class="dg">删除</button></div>
    <textarea id="vpose" rows="2" placeholder="pose 描述（可手动修改）"></textarea>
  </div>
</div>
<div id="m" hidden><div id="mb"></div></div>
<div id="tt" hidden></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let cfg=JSON.parse(ls.get('cfg')||'{}');
const OLD=/github\.io$/.test(location.hostname)||!location.hostname,API=OLD?'https://pose-tts.icemare7.workers.dev':'';
const S={data:{cats:['常用半装','全装','特殊动作'],items:[]},sha:null,cat:'全部',v:'gal',sort:ls.get('sort')||'r'},local={},P={i:0,rand:false,on:false};

/* theme */
function theme(t){document.documentElement.dataset.theme=t;ls.set('th',t)}
theme(ls.get('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#th').onclick=e=>{e.currentTarget.classList.toggle('sp');theme(document.documentElement.dataset.theme=='dark'?'light':'dark')};

/* toast */
let tt;function toast(s,ms=2500){const e=$('#tt');e.textContent=s;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,ms)}

/* api */
const b64b=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const isAdmin=()=>!!cfg.admin;
async function api(path,body){
  const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json',...(cfg.admin?{'X-Admin':cfg.admin}:{})},body:JSON.stringify(body||{})});
  if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).error||t}catch{}throw new Error(String(m||r.status).slice(0,120))}
  return r.json().catch(()=>({}))
}
const del=async p=>{const m=p.match(/images\/(\w+)\.jpg/);if(m)try{await api('/delete',{id:m[1]})}catch(e){toast('删除失败：'+e.message,4000)}};
async function saveData(){
  if(!isAdmin()){toast('需要管理员登录才能保存修改',3500);return}
  try{await api('/save',{cats:S.data.cats,items:S.data.items.map(i=>({id:i.id,cat:i.cat,pose:i.pose||'',r:i.r||0}))})}
  catch(e){toast('保存失败：'+e.message,4500)}
}
let q=Promise.resolve();const save=()=>q=q.then(saveData);
async function load(){
  try{const r=await fetch(API+'/data?t='+Date.now());if(!r.ok)throw 0;const j=await r.json();S.data=j.data;S.repo=j.repo;S.br=j.branch||'main';S.size=j.size||0;S.voices=j.voices;S.def=j.voice}
  catch{toast('读取失败，请检查网络',4000)}
  S.fx=1;render();usage()
}
function usage(){
  const e=$('#usage');if(!S.size){e.hidden=true;return}
  const mb=S.size/1024;
  e.lastElementChild.textContent=`${S.data.items.length} 张图 · 仓库已用 ${mb<1024?mb.toFixed(1)+' MB':(mb/1024).toFixed(2)+' GB'} / 建议上限 1 GB`;
  e.querySelector('i').style.width=Math.max(1,Math.min(100,mb/10.24))+'%';e.hidden=false
}
const fileBase=()=>OLD?`https://raw.githubusercontent.com/${S.repo}/${S.br}/`:'/f/';
const U=(it,t)=>local[it.id]?.[t]||(S.repo?fileBase():'')+(t=='thumb'?'thumbs/':'images/')+it.id+'.jpg';

/* compress */
function comp(f,max,qy){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res({b,w:c.width,h:c.height}),'image/jpeg',qy)};im.onerror=()=>rej(new Error('无法读取图片'));im.src=u})}

/* upload (anyone, no login) */
$('#up').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{upload([...e.target.files]);e.target.value=''};
async function upload(files){
  let n=0,bad=0;
  for(const f of files){
    n++;toast(`上传并识别中 ${n}/${files.length}…`,999999);
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    try{
      const full=await comp(f,1600,.8),th=await comp(f,480,.75),fb=await b64b(full.b),tb=await b64b(th.b);
      local[id]={img:URL.createObjectURL(full.b),thumb:URL.createObjectURL(th.b)};
      const it={id,cat:S.cat=='全部'?'未分类':S.cat,pose:'',w:full.w,h:full.h,ts:Date.now()};
      S.data.items.unshift(it);render();
      const j=await api('/upload',{id,img:fb,thumb:tb,w:full.w,h:full.h,cat:it.cat,ts:it.ts});
      it.pose=j.pose||'';it.ah=j.ah;it.au=j.au;render()
    }catch(e){bad++;S.data.items=S.data.items.filter(x=>x.id!=id);render();toast('上传失败：'+e.message,5000)}
  }
  if(!bad){toast('上传完成',2000);setTimeout(load,2500)}
}

/* pose recognition (server side, admin) */
async function recog(it,quiet,batch,force){
  if(!isAdmin()){toast('需要管理员登录');return false}
  if(!quiet)toast('识别 pose 中…',999999);
  try{
    const j=await api('/recog',{id:it.id,force});
    it.pose=j.pose||'';it.ah=j.ah;it.au=j.au;if(!it.pose)throw new Error('模型没有返回内容');
    if(!batch)toast('已识别 pose',1500);
    render();if(V.on)showV();return true
  }catch(e){toast('识别失败：'+e.message,5000);return false}
}
let busy=false;
async function recogAll(){
  if(!isAdmin()){toast('需要管理员登录');openSet();return}
  const l=S.data.items.filter(needs);if(busy||!l.length)return;
  busy=true;let ok=0;
  for(const it of l){toast(`识别中 ${ok+1}/${l.length}…`,999999);if(await recog(it,true,true))ok++;else break}
  busy=false;if(ok==l.length)toast(`完成，新识别 ${ok} 张`,3000)
}

/* render */

$('#lgm').innerHTML=fig('#fff','#fff');
addEventListener('paste',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  const fs=[...(e.clipboardData?.items||[])].map(i=>i.kind=='file'?i.getAsFile():null).filter(f=>f&&f.type.startsWith('image/'));
  if(fs.length){e.preventDefault();toast(`收到 ${fs.length} 张粘贴的图片`,1200);upload(fs)}
});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{const fs=[...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();upload(fs)}});
load();
</script>
</body>
</html>
