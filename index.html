<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pose 图库</title>
<style>
:root{--bg:#fff;--bg2:#f6f6f6;--fg:#121212;--fg2:#646464;--line:#ebebeb;--blue:#0066ff;--soft:#e5f0ff;--dg:#d93025}
:root[data-theme=dark]{--bg:#121212;--bg2:#1e1e1e;--fg:#e8e8e8;--fg2:#9a9a9a;--line:#2c2c2c;--blue:#4c94ff;--soft:#14284a;--dg:#ff6b60}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 14px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.on{background:var(--soft);border-color:var(--blue);color:var(--blue)}
button.dg{color:var(--dg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0) 12px 0;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px))}
.logo{font-weight:700;color:var(--blue);font-size:18px;white-space:nowrap}
#tabs{display:flex;gap:4px;flex:1}
#tabs button{border:0;background:none;color:var(--fg2);font-weight:600;padding:6px 10px}
#tabs button.on{color:var(--blue);background:var(--soft)}
.ib{width:38px;height:38px;padding:0;border:0;background:none;display:grid;place-items:center;border-radius:50%;font-size:18px}
.ib:hover{background:var(--bg2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#up{color:var(--blue)}
main{max-width:1200px;margin:0 auto;padding:12px}
#warn{background:var(--soft);color:var(--blue);border-radius:8px;padding:8px 12px;margin-bottom:10px}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:16px;padding:3px 14px;background:var(--bg2);border:0}
.chip.on{background:var(--soft);color:var(--blue);font-weight:600}
#gal{columns:2;column-gap:10px}
@media(min-width:700px){#gal{columns:4}}
@media(min-width:1100px){#gal{columns:5}}
.card{break-inside:avoid;margin-bottom:10px;position:relative;border-radius:10px;overflow:hidden;background:var(--bg2);cursor:zoom-in}
.card img{display:block;width:100%;height:auto}
.tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:0 8px;border-radius:10px}
.empty{color:var(--fg2);text-align:center;padding:60px 16px;column-span:all}
.pcard{background:var(--bg2);border-radius:14px;padding:14px;text-align:center;margin-bottom:14px}
.pcard>img{max-height:42vh;max-width:100%;border-radius:10px;cursor:zoom-in}
.pn{color:var(--fg2);margin-top:6px}
.pt{font-size:20px;line-height:1.6;margin:8px 0 12px;font-weight:600}
.pbtn{display:flex;gap:8px;justify-content:center;margin-top:8px}
.pbtn button{flex:1;max-width:160px;padding:10px}
.hint{color:var(--fg2);font-size:13px;margin:10px 0 0}
.prow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.prow img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none}
.prow .tx{flex:1;cursor:pointer}.prow .tx small{color:var(--blue)}
.prow .tx.cur{color:var(--blue)}
#v{position:fixed;inset:0;z-index:20;background:#000;color:#eee;display:flex;flex-direction:column}
#v[hidden],#m[hidden],[hidden]{display:none!important}
.vt{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px}
.vt .sp{flex:1}.vt button{background:rgba(255,255,255,.12);border:0;color:#fff;min-width:38px}
#st{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;position:relative}
#vi{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;will-change:transform}
.nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:56px;font-size:26px;padding:0;z-index:2}
.nv.l{left:6px}.nv.r{right:6px}
.vp{background:var(--bg);color:var(--fg);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row select,.row input{flex:1}
#m{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
#mb{background:var(--bg);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
#mb h3{margin:0 0 10px}#mb label{display:block;font-size:13px;color:var(--fg2);margin:8px 0 3px}
.mr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.mr span{flex:1}
#tt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:40;max-width:90vw;font-size:14px}
</style>
</head>
<body>
<header>
  <span class="logo">Pose 图库</span>
  <div id="tabs"><button data-v="gal">图库</button><button data-v="pose">Pose 库</button></div>
  <button class="ib" id="th" title="白天/黑夜" aria-label="切换主题">◐</button>
  <button class="ib" id="st2" title="设置" aria-label="设置">⚙</button>
  <button class="ib" id="up" title="上传图片" aria-label="上传图片"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button>
  <input type="file" id="fi" accept="image/*" multiple hidden>
</header>
<main>
  <div id="warn">还没连接 GitHub：点右上角 ⚙ 填写仓库和 Token 后即可上传、分类和修改。</div>
  <div id="chips"></div>
  <div id="gal"></div>
  <div id="pose" hidden></div>
</main>

<div id="v" hidden>
  <div class="vt"><span id="vc"></span><span class="sp"></span><button id="zo" aria-label="缩小">−</button><button id="zi" aria-label="放大">+</button><button id="vx" aria-label="关闭">✕</button></div>
  <div id="st"><img id="vi" alt=""><button class="nv l" id="vl" aria-label="上一张">‹</button><button class="nv r" id="vr" aria-label="下一张">›</button></div>
  <div class="vp">
    <div class="row"><select id="vcat" aria-label="分类"></select><button id="vrec">识别 pose</button><button id="vdel" class="dg">删除</button></div>
    <textarea id="vpose" rows="2" placeholder="pose 描述（可手动修改）"></textarea>
  </div>
</div>
<div id="m" hidden><div id="mb"></div></div>
<div id="tt" hidden></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let cfg=JSON.parse(ls.get('cfg')||'{}');
if(!cfg.owner&&location.hostname.endsWith('.github.io')){cfg.owner=location.hostname.split('.')[0];cfg.repo=location.pathname.split('/')[1]||location.hostname}
const S={data:{cats:['常用半装','全装','特殊动作'],items:[]},sha:null,cat:'全部',v:'gal'},local={},P={i:0,rand:false,on:false};
const br=()=>cfg.branch||'main';

/* theme */
function theme(t){document.documentElement.dataset.theme=t;ls.set('th',t)}
theme(ls.get('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#th').onclick=()=>theme(document.documentElement.dataset.theme=='dark'?'light':'dark');

/* toast */
let tt;function toast(s,ms=2500){const e=$('#tt');e.textContent=s;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,ms)}

/* github */
const gh=(p,o={})=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`,{...o,headers:{Accept:'application/vnd.github+json',...(cfg.token?{Authorization:'Bearer '+cfg.token}:{})}});
const b64s=s=>{let t='';new TextEncoder().encode(s).forEach(c=>t+=String.fromCharCode(c));return btoa(t)};
const b64b=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
async function put(p,c){const r=await gh(p,{method:'PUT',body:JSON.stringify({message:'add '+p,content:c,branch:br()})});if(!r.ok)throw new Error(p+' → '+r.status)}
async function del(p){try{const g=await gh(`${p}?ref=${br()}`);if(!g.ok)return;const j=await g.json();await gh(p,{method:'DELETE',body:JSON.stringify({message:'delete '+p,sha:j.sha,branch:br()})})}catch{}}
async function saveData(){
  if(!cfg.token)return;
  try{
    const body={message:'update data',content:b64s(JSON.stringify(S.data)),branch:br()};if(S.sha)body.sha=S.sha;
    let r=await gh('data.json',{method:'PUT',body:JSON.stringify(body)});
    if(r.status==409||r.status==422){const g=await gh(`data.json?ref=${br()}`);if(g.ok){body.sha=(await g.json()).sha;r=await gh('data.json',{method:'PUT',body:JSON.stringify(body)})}}
    if(r.ok)S.sha=(await r.json()).content.sha;else toast('保存失败 '+r.status,4000)
  }catch(e){toast('保存失败：网络错误',4000)}
}
let q=Promise.resolve();const save=()=>q=q.then(saveData);
async function load(){
  try{
    if(cfg.owner&&cfg.repo){
      const r=await gh(`data.json?ref=${br()}`);
      if(r.ok){const j=await r.json();S.sha=j.sha;S.data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}
      else if(r.status!=404)toast('读取失败 '+r.status,4000)
    }else{const r=await fetch('data.json?t='+Date.now());if(r.ok)S.data=await r.json()}
  }catch{}
  render()
}
const U=(it,t)=>local[it.id]?.[t]||(cfg.owner?`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${br()}/`:'')+(t=='thumb'?'thumbs/':'images/')+it.id+'.jpg';

/* compress */
function comp(f,max,qy){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res({b,w:c.width,h:c.height}),'image/jpeg',qy)};im.onerror=()=>rej(new Error('无法读取图片'));im.src=u})}

/* upload */
$('#up').onclick=()=>{if(!cfg.token||!cfg.owner||!cfg.repo){toast('请先填写 GitHub 设置');openSet();return}$('#fi').click()};
$('#fi').onchange=e=>{upload([...e.target.files]);e.target.value=''};
async function upload(files){
  let n=0;
  for(const f of files){
    n++;toast(`处理中 ${n}/${files.length}…`,999999);
    try{
      const full=await comp(f,1600,.8),th=await comp(f,480,.75),id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      const fb=await b64b(full.b),tb=await b64b(th.b);
      local[id]={img:URL.createObjectURL(full.b),thumb:URL.createObjectURL(th.b),b64:fb};
      const it={id,cat:S.cat=='全部'?'未分类':S.cat,pose:'',w:full.w,h:full.h,ts:Date.now()};
      S.data.items.unshift(it);render();
      await put(`images/${id}.jpg`,fb);await put(`thumbs/${id}.jpg`,tb);await save();
      if(cfg.akey)await recog(it,true)
    }catch(e){toast('上传失败：'+e.message,4000)}
  }
  toast('上传完成',2000)
}

/* pose recognition (Claude API) */
async function recog(it,quiet){
  if(!cfg.akey){toast('请先在设置里填 Claude API Key');return}
  if(!quiet)toast('识别 pose 中…',999999);
  try{
    let d=local[it.id]?.b64;
    if(!d)d=await b64b(await (await fetch(U(it,'img'))).blob());
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.akey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:300,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}},{type:'text',text:'这是一张人像摄影 pose 参考图。请用中文，用一到两句简短口语化的话描述这个 pose，方便语音播报：说明站/坐/躺、身体朝向、手的位置、腿的位置、头部和视线。只输出描述本身，不要任何前缀。'}]}]})});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
    it.pose=j.content.map(c=>c.text||'').join('').trim();
    await save();render();if(V.on)showV();toast('已识别 pose',1500)
  }catch(e){toast('识别失败：'+e.message,4000)}
}

/* render */
const items=()=>S.cat=='全部'?S.data.items:S.data.items.filter(i=>i.cat==S.cat);
function render(){
  const cs=['全部',...S.data.cats,...(S.data.items.some(x=>x.cat=='未分类')?['未分类']:[])];
  $('#chips').innerHTML=cs.map(c=>`<button class="chip${c==S.cat?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')+'<button class="chip" id="mc">管理分类</button>';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.v));
  $('#gal').hidden=S.v!='gal';$('#pose').hidden=S.v!='pose';$('#warn').hidden=!!cfg.token;
  S.v=='gal'?renderGal():renderPose()
}
function renderGal(){
  const l=items();
  $('#gal').innerHTML=l.length?l.map(i=>`<div class="card" data-id="${i.id}"><img loading="lazy" src="${U(i,'thumb')}" width="${i.w}" height="${i.h}" alt=""><span class="tag">${esc(i.cat)}</span></div>`).join(''):'<div class="empty">这里还没有图片，点右上角 ↑ 上传。</div>'
}
const plist=()=>items().filter(i=>i.pose);
function renderPose(){
  const l=plist();if(P.i>=l.length)P.i=0;const c=l[P.i];
  $('#pose').innerHTML=`<div class="pcard">${c?`<img src="${U(c,'thumb')}" data-id="${c.id}" alt=""><div class="pn">第 ${P.i+1}/${l.length} 条 · ${esc(c.cat)}</div><div class="pt">${esc(c.pose)}</div>`:'<div class="empty">这个分类下还没有 pose。填入 Claude API Key 后，上传图片会自动识别。</div>'}
  <div class="pbtn"><button id="pp">上一条</button><button id="ps" class="pri">播报</button><button id="pn">下一条</button></div>
  <div class="pbtn"><button id="pr" class="${P.rand?'on':''}">随机：${P.rand?'开':'关'}</button><button id="pv" class="${P.on?'on':''}">语音控制：${P.on?'开':'关'}</button></div>
  <p class="hint">开启语音控制后，说“下一个”“上一个”“重复”“随机”“停止”。</p></div>
  ${items().map(i=>`<div class="prow"><img src="${U(i,'thumb')}" data-id="${i.id}" alt=""><div class="tx${c&&c.id==i.id?' cur':''}" data-p="${i.id}"><small>${esc(i.cat)}</small><br>${i.pose?esc(i.pose):'<span style="color:var(--fg2)">未识别，点缩略图进入后识别或手写</span>'}</div></div>`).join('')}`
}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='mc')return manage();S.cat=b.dataset.c;P.i=0;render()};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){S.v=b.dataset.v;render()}};
$('#gal').onclick=e=>{const c=e.target.closest('.card');if(c)openV(c.dataset.id)};
$('#pose').onclick=e=>{
  const t=e.target,im=t.closest('img');if(im)return openV(im.dataset.id);
  const p=t.closest('[data-p]');if(p){const k=plist().findIndex(x=>x.id==p.dataset.p);if(k>=0){P.i=k;renderPose();speak()}return}
  const b=t.closest('button');if(!b)return;
  if(b.id=='pp')nav(-1,1);else if(b.id=='pn')nav(1);else if(b.id=='ps')speak();
  else if(b.id=='pr'){P.rand=!P.rand;renderPose()}else if(b.id=='pv')listen(!P.on)
};

/* voice */
function speak(){const c=plist()[P.i];if(!c)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`第${P.i+1}条，${c.cat}。${c.pose}`);u.lang='zh-CN';speechSynthesis.speak(u)}
function nav(d,back){const l=plist();if(!l.length)return;P.i=P.rand&&!back?Math.floor(Math.random()*l.length):(P.i+d+l.length)%l.length;renderPose();speak()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
function listen(on){
  if(on){
    if(!SR){toast('当前浏览器不支持语音识别，建议用 Chrome',4000);return}
    P.on=true;rec=new SR();rec.lang='zh-CN';rec.continuous=true;rec.interimResults=false;
    rec.onresult=e=>{if(speechSynthesis.speaking)return;cmd(e.results[e.results.length-1][0].transcript)};
    rec.onend=()=>{if(P.on)try{rec.start()}catch{}};
    rec.onerror=e=>{if(e.error=='not-allowed'){P.on=false;toast('请允许麦克风权限',4000);renderPose()}};
    try{rec.start()}catch{}
  }else{P.on=false;try{rec.stop()}catch{}}
  renderPose()
}
function cmd(t){
  if(/下一|next/i.test(t))nav(1);else if(/上一/.test(t))nav(-1,1);
  else if(/重复|再说|再来|播报/.test(t))speak();
  else if(/随机/.test(t)){P.rand=true;nav(1)}
  else if(/停止|结束|关闭/.test(t)){speechSynthesis.cancel();listen(false)}
}

/* viewer */
const V={on:false,list:[],i:0,s:1,x:0,y:0},ptr=new Map(),vi=$('#vi'),st=$('#st');let pd=0,ps=1,sw=null,lt=0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),tf=()=>vi.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`;
function zoom(s){V.s=clamp(s,1,6);if(V.s==1)V.x=V.y=0;tf()}
function openV(id){V.list=items();if(S.v=='pose')V.list=S.data.items.filter(x=>items().includes(x));V.i=Math.max(0,V.list.findIndex(x=>x.id==id));V.on=true;$('#v').hidden=false;showV()}
function showV(){
  const it=V.list[V.i];if(!it)return closeV();
  V.s=1;V.x=V.y=0;tf();vi.src=U(it,'img');
  $('#vc').textContent=`${V.i+1} / ${V.list.length}`;
  $('#vcat').innerHTML=[...S.data.cats,'未分类'].map(c=>`<option${c==it.cat?' selected':''}>${esc(c)}</option>`).join('');
  $('#vpose').value=it.pose||'';
  $('#vrec').hidden=!cfg.akey
}
function closeV(){V.on=false;$('#v').hidden=true;render()}
const go=d=>{if(V.list.length>1){V.i=(V.i+d+V.list.length)%V.list.length;showV()}};
$('#vx').onclick=closeV;$('#vl').onclick=()=>go(-1);$('#vr').onclick=()=>go(1);
$('#zi').onclick=()=>zoom(V.s*1.4);$('#zo').onclick=()=>zoom(V.s/1.4);
document.addEventListener('keydown',e=>{if(!V.on||/TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowLeft')go(-1);else if(e.key=='ArrowRight')go(1);else if(e.key=='Escape')closeV()});
st.addEventListener('wheel',e=>{e.preventDefault();zoom(V.s*(e.deltaY<0?1.15:.87))},{passive:false});
const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
st.onpointerdown=e=>{if(e.target.closest('.nv'))return;st.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size==2){pd=dist();ps=V.s;sw=null}else sw={x:e.clientX,y:e.clientY,ox:V.x,oy:V.y}};
st.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size==2){zoom(ps*dist()/pd)}else if(sw&&V.s>1){V.x=sw.ox+e.clientX-sw.x;V.y=sw.oy+e.clientY-sw.y;tf()}};
st.onpointerup=e=>{
  ptr.delete(e.pointerId);if(!sw||ptr.size)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y,moved=Math.hypot(dx,dy)>8;
  if(!moved){const n=Date.now();if(n-lt<300){zoom(V.s>1?1:2.5);lt=0}else lt=n}
  else if(V.s<=1.02&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);
  sw=null
};
st.onpointercancel=e=>{ptr.delete(e.pointerId);sw=null};
$('#vcat').onchange=e=>{const it=V.list[V.i];it.cat=e.target.value;save()};
$('#vpose').onchange=e=>{const it=V.list[V.i];it.pose=e.target.value.trim();save()};
$('#vrec').onclick=()=>recog(V.list[V.i]);
$('#vdel').onclick=async()=>{
  const it=V.list[V.i];if(!confirm('确定删除这张图片？'))return;
  S.data.items=S.data.items.filter(x=>x!=it);V.list.splice(V.i,1);if(V.i>=V.list.length)V.i=0;
  render();if(V.list.length)showV();else closeV();
  toast('删除中…',999999);await del(`images/${it.id}.jpg`);await del(`thumbs/${it.id}.jpg`);await save();toast('已删除',1500)
};

/* modal: settings & categories */
function modal(h){$('#m').hidden=false;$('#mb').innerHTML=h}
const closeM=()=>$('#m').hidden=true;
$('#m').onclick=e=>{if(e.target.id=='m')closeM()};
$('#st2').onclick=openSet;
function openSet(){
  modal(`<h3>设置</h3>
  <label>GitHub 用户名</label><input id="s1" value="${esc(cfg.owner||'')}" autocapitalize="off">
  <label>仓库名</label><input id="s2" value="${esc(cfg.repo||'')}" autocapitalize="off">
  <label>分支</label><input id="s3" value="${esc(cfg.branch||'main')}" autocapitalize="off">
  <label>GitHub Token（Contents 读写权限，只保存在这台设备的浏览器里）</label><input id="s4" type="password" value="${esc(cfg.token||'')}">
  <label>Claude API Key（可选，用于自动识别 pose）</label><input id="s5" type="password" value="${esc(cfg.akey||'')}">
  <div class="row" style="margin-top:14px"><button data-a="ok">取消</button><button class="pri" id="sv">保存并刷新</button></div>`)
}
$('#mb').onclick=e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id=='sv'){cfg={owner:$('#s1').value.trim(),repo:$('#s2').value.trim(),branch:$('#s3').value.trim()||'main',token:$('#s4').value.trim(),akey:$('#s5').value.trim()};ls.set('cfg',JSON.stringify(cfg));closeM();load();return}
  const a=t.dataset.a,i=+t.dataset.i;
  if(a=='ok')closeM();
  else if(a=='ren'){const n=prompt('新的分类名',S.data.cats[i]);if(n&&n.trim()){const o=S.data.cats[i];S.data.cats[i]=n.trim();S.data.items.forEach(x=>{if(x.cat==o)x.cat=n.trim()});if(S.cat==o)S.cat=n.trim();save();render();manage()}}
  else if(a=='del'){const o=S.data.cats[i];if(confirm(`删除分类“${o}”？里面的图片会移到“未分类”。`)){S.data.cats.splice(i,1);S.data.items.forEach(x=>{if(x.cat==o)x.cat='未分类'});if(S.cat==o)S.cat='全部';save();render();manage()}}
  else if(t.id=='ac'){const n=$('#nc').value.trim();if(n&&!S.data.cats.includes(n)){S.data.cats.push(n);save();render();manage()}}
};
function manage(){
  modal(`<h3>分类管理</h3>${S.data.cats.map((c,i)=>`<div class="mr"><span>${esc(c)}</span><button data-a="ren" data-i="${i}">改名</button><button data-a="del" data-i="${i}" class="dg">删除</button></div>`).join('')}
  <div class="row" style="margin-top:10px"><input id="nc" placeholder="新分类名"><button class="pri" id="ac">添加</button></div>
  <button data-a="ok" style="width:100%">完成</button>`)
}
load();
</script>
</body>
